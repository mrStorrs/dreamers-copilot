name: verify-dreamers-package

on:
  pull_request:
    paths:
      - '.github/**'
      - 'README.md'
      - 'Install-Dreamers.ps1'
      - 'Remove-Dreamers.ps1'
      - '.github/catalog.json'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'README.md'
      - 'Install-Dreamers.ps1'
      - 'Remove-Dreamers.ps1'
      - '.github/catalog.json'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate through Bash launcher
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/Test-DreamersCopilot.sh
      - name: Validate package with PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-DreamersCopilot.ps1
