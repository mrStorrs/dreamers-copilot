name: verify-dreamers-package

on:
  pull_request:
    paths:
      - '.github/**'
      - 'README.md'
      - 'Install-Dreamers.ps1'
      - 'Remove-Dreamers.ps1'
      - '.github/catalog.json'
      - 'scripts/**'
      - 'adapters/**'
      - 'tests/**'
      - '*DreamersCodex*'
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'README.md'
      - 'Install-Dreamers.ps1'
      - 'Remove-Dreamers.ps1'
      - '.github/catalog.json'
      - 'scripts/**'
      - 'adapters/**'
      - 'tests/**'
      - '*DreamersCodex*'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Validate Dreamers package with Bash
        shell: bash
        run: scripts/Test-DreamersCopilot.sh
      - name: Validate Dreamers package and migration with PowerShell
        shell: pwsh
        run: ./scripts/Test-DreamersCopilot.ps1
      - name: Validate generated Codex package and Bash installation
        shell: bash
        run: scripts/Test-DreamersCodex.sh
      - name: Validate Codex PowerShell installation and removal
        shell: pwsh
        run: ./scripts/Test-DreamersCodex.ps1

  codex-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate Codex build, installation, and removal on Windows
        shell: pwsh
        run: ./scripts/Test-DreamersCodex.ps1
