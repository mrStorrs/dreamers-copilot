name: verify-dreamers-package

on:
  pull_request:
    paths:
      - '.github/**'
      - 'README.md'
      - 'Install-Dreamers.ps1'
      - 'Remove-Dreamers.ps1'
      - '.github/catalog.json'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'README.md'
      - 'Install-Dreamers.ps1'
      - 'Remove-Dreamers.ps1'
      - '.github/catalog.json'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Validate Dreamers package with Bash
        shell: bash
        run: scripts/Test-DreamersCopilot.sh
      - name: Validate Dreamers package and migration with PowerShell
        shell: pwsh
        run: ./scripts/Test-DreamersCopilot.ps1
