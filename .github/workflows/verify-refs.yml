name: verify

on:
  pull_request:
    paths:
      - '.github/**/*.md'
      - '.github/dreamers/scripts/**'
      - 'scripts/sync-refs.sh'
      - 'test-benchmarks.md'
      - 'tests/**'
      - '.github/workflows/verify-refs.yml'
  push:
    branches: [main]
    paths:
      - '.github/**/*.md'
      - '.github/dreamers/scripts/**'
      - 'scripts/sync-refs.sh'
      - 'test-benchmarks.md'
      - 'tests/**'
      - '.github/workflows/verify-refs.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Verify inlined refs match source
        shell: bash
        run: scripts/sync-refs.sh -Verify
      - name: Run stats writer tests
        shell: bash
        run: python3 -m unittest tests/test_dreamers_stats.py
